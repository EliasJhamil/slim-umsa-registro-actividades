worker_processes auto;              # ajusta workers según CPUs disponibles

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance básico ───────────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── Upstream: el backend FastAPI ─────────────────────
    # "backend" es el nombre del servicio en docker-compose
    upstream fastapi_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;           # acepta cualquier hostname (cambiar en prod)

        # ── /api/** → FastAPI ────────────────────────────
        # Todo lo que empiece con /api/ se redirige al backend
        location /api/ {
            proxy_pass         http://fastapi_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Necesario para respuestas grandes (exportación de informes)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 20M;    # tamaño máximo de archivos subidos
        }

        # ── /docs y /redoc → Swagger (solo en desarrollo) ─
        location /docs {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }
        location /redoc {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        # ── Frontend SPA ─────────────────────────────────
        # Todo lo demás sirve el index.html (hash router del frontend)
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;   # SPA fallback
        }

        # ── Cache para assets estáticos ──────────────────
        location ~* \.(css|js|png|jpg|ico|woff2?)$ {
            root  /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
}